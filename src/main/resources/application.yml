spring:
  application:
    name: llm-gateway
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/gateway}
    username: ${DATABASE_USERNAME:gateway}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE

gateway:
  admin:
    token: ${ADMIN_TOKEN:}
  providers:
    fake:
      latency-ms:
        fake-fast: ${FAKE_FAST_LATENCY_MS:50}
        fake-slow: ${FAKE_SLOW_LATENCY_MS:1000}
      error-rate: ${FAKE_ERROR_RATE:0.0}
