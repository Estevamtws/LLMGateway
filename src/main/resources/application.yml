spring:
  application:
    name: llm-gateway
  # Lets local runs (IDE, mvn spring-boot:run) read the same .env file that Docker Compose uses.
  # Real environment variables still take precedence over values from .env.
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/gateway}
    username: ${DATABASE_USERNAME:gateway}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE

gateway:
  admin:
    token: ${ADMIN_TOKEN:}
  providers:
    fake:
      latency-ms:
        fake-fast: ${FAKE_FAST_LATENCY_MS:50}
        fake-slow: ${FAKE_SLOW_LATENCY_MS:1000}
      error-rate: ${FAKE_ERROR_RATE:0.0}
    # Any OpenAI-compatible API. Disabled unless OPENAI_API_KEY is set.
    openai:
      name: ${OPENAI_PROVIDER_NAME:openai}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY:}
      models: ${OPENAI_MODELS:}
      connect-timeout-ms: ${OPENAI_CONNECT_TIMEOUT_MS:2000}
      read-timeout-ms: ${OPENAI_READ_TIMEOUT_MS:30000}
  resilience:
    retry:
      max-attempts: ${RETRY_MAX_ATTEMPTS:3}
      initial-wait-ms: ${RETRY_INITIAL_WAIT_MS:200}
      multiplier: 2.0
      retry-on-timeout: ${RETRY_ON_TIMEOUT:false}
    circuit-breaker:
      failure-rate-threshold: ${CB_FAILURE_RATE_THRESHOLD:50}
      sliding-window-size: ${CB_SLIDING_WINDOW_SIZE:20}
      minimum-number-of-calls: ${CB_MINIMUM_NUMBER_OF_CALLS:10}
      wait-in-open-ms: ${CB_WAIT_IN_OPEN_MS:30000}
      permitted-calls-in-half-open: 3
  # USD per million tokens. Every model a provider serves needs an entry, or startup fails.
  pricing:
    models:
      fake-fast:
        input-per-million: 0.10
        output-per-million: 0.40
      fake-slow:
        input-per-million: 1.00
        output-per-million: 4.00
      # Add one entry per model in OPENAI_MODELS, with the provider's current prices, e.g.:
      # gpt-4o-mini:
      #   input-per-million: 0.15
      #   output-per-million: 0.60
      # Use brackets for names with dots or slashes: "[openai/gpt-4.1]":
