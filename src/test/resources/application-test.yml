gateway:
  admin:
    token: test-admin-token
  providers:
    fake:
      latency-ms:
        fake-fast: 0
        fake-slow: 0
      error-rate: 0.0
  resilience:
    retry:
      max-attempts: 3
      initial-wait-ms: 1
    circuit-breaker:
      # High enough that failure tests sharing this context never open the circuit.
      minimum-number-of-calls: 1000
      sliding-window-size: 1000
  pricing:
    models:
      test-error:
        input-per-million: 1.00
        output-per-million: 1.00
      test-timeout:
        input-per-million: 1.00
        output-per-million: 1.00
